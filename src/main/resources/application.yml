spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: uteexpress
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: uteexpress
    schemas: uteexpress
    locations: classpath:db/migration
    validate-migration-naming: true
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true
  sql:
    init:
      mode: never
  application:
    name: uteexpress
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  thymeleaf:
    check-template-location: true
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
uteexpress:
  security:
    jwt:
      issuer: uteexpress
      audience: uteexpress-web
      ttl: PT30M
      clock-skew: PT60S
      cookie-name: UTEEXPRESS_AUTH
      cookie-secure: ${JWT_COOKIE_SECURE:true}
      secret-base64: ${JWT_SECRET_BASE64}
