<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Khuyến mãi sản phẩm — Admin | UTEExpress</title></head>
<body><section class="app-page-section">
    <a class="app-back-link" th:href="@{/admin/promotions}">← Chọn sản phẩm</a>
    <h1>Khuyến mãi sản phẩm — Admin</h1><p th:text="${product.name}"></p>
    <p>Thời gian Việt Nam (UTC+7). Thời điểm kết thúc không nằm trong lịch áp dụng.</p>
    <a class="btn btn-app-primary mb-3" th:href="@{/admin/promotions/products/{p}/new(p=${product.id})}">Tạo khuyến mãi</a>
    <p th:if="${#lists.isEmpty(promotions)}">Chưa có khuyến mãi cho sản phẩm này.</p>
    <div class="table-responsive"><table class="table align-middle" th:unless="${#lists.isEmpty(promotions)}">
        <thead><tr><th>Tên</th><th>Giảm (%)</th><th>Bắt đầu</th><th>Kết thúc</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody><tr th:each="promotion : ${promotions}">
            <td th:text="${promotion.name}"></td><td th:text="${promotion.discountPercent}"></td>
            <td th:text="${#temporals.format(promotion.startsAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
            <td th:text="${#temporals.format(promotion.endsAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
            <td th:text="${promotion.status}"></td><td>
                <a class="btn btn-sm btn-app-secondary" th:href="@{/admin/promotions/products/{p}/{id}/edit(p=${product.id},id=${promotion.id})}">Chỉnh sửa</a>
                <a class="btn btn-sm btn-outline-danger" th:if="${promotion.active}" th:href="@{/admin/promotions/products/{p}/{id}/disable(p=${product.id},id=${promotion.id})}">Tắt…</a>
            </td>
        </tr></tbody>
    </table></div>
</section></body></html>
