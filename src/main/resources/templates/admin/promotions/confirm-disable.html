<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Xác nhận ngừng khuyến mãi | UTEExpress</title></head><body><section class="app-page-section">
<h1>Xác nhận ngừng khuyến mãi</h1><p>Lịch sử sử dụng và giá trị các đơn hàng đã tạo được giữ nguyên. Thao tác này ngừng áp dụng cho các lần mua tiếp theo.</p>
<p><strong th:text="${promotion.name}"></strong></p>
<form method="post" th:action="@{/admin/promotions/products/{p}/{id}/disable(p=${product.id},id=${promotion.id})}"><input type="hidden" name="version" th:value="${promotion.version}">
<div class="d-flex flex-wrap gap-3"><button class="btn btn-danger" type="submit">Xác nhận ngừng</button><a class="btn btn-app-secondary" th:href="@{/admin/promotions/products/{p}(p=${product.id})}">Hủy, giữ nguyên</a></div></form>
</section></body></html>
