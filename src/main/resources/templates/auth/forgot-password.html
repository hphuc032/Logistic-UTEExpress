<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Quên mật khẩu | UTEExpress</title>
</head>
<body>
<main>
    <section class="app-auth-section" aria-labelledby="forgot-password-title">
        <div class="app-auth-card">
            <div class="app-auth-heading">
                <span class="app-eyebrow">Khôi phục tài khoản</span>
                <h1 id="forgot-password-title">Quên mật khẩu</h1>
                <p>Nhập email đăng ký để tiếp tục đến bước xác nhận.</p>
            </div>

            <form method="post" th:action="@{/forgot-password}"
                  th:object="${forgotPasswordForm}" novalidate>
                <div class="mb-4">
                    <label class="form-label" for="email">
                        Email <span class="app-required" aria-hidden="true">*</span>
                    </label>
                    <input class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           type="email" id="email" th:field="*{email}"
                           autocomplete="email" maxlength="254" required
                           aria-describedby="email-help email-error">
                    <div id="email-help" class="form-text">
                        Phản hồi luôn giống nhau để bảo vệ thông tin tài khoản.
                    </div>
                    <div id="email-error" class="invalid-feedback"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}" role="alert">Email không hợp lệ.</div>
                </div>

                <button class="btn btn-app-primary btn-lg w-100" type="submit">
                    Tiếp tục
                </button>
            </form>

            <p class="app-auth-switch">
                Đã nhớ mật khẩu? <a th:href="@{/login}" href="/login">Đăng nhập</a>
            </p>
        </div>
    </section>
</main>
</body>
</html>
