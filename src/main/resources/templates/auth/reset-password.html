<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Đặt lại mật khẩu | UTEExpress</title>
</head>
<body>
<main>
    <section class="app-auth-section" aria-labelledby="reset-password-title">
        <div class="app-auth-card">
            <div class="app-auth-heading">
                <span class="app-eyebrow">Bảo vệ tài khoản</span>
                <h1 id="reset-password-title">Đặt lại mật khẩu</h1>
                <p>Nhập email, mã xác nhận và mật khẩu mới của bạn.</p>
            </div>

            <form method="post" th:action="@{/reset-password}"
                  th:object="${resetPasswordForm}" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="email">
                        Email <span class="app-required" aria-hidden="true">*</span>
                    </label>
                    <input class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           type="email" id="email" th:field="*{email}"
                           autocomplete="email" maxlength="254" required
                           aria-describedby="email-error">
                    <div id="email-error" class="invalid-feedback"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}" role="alert">Email không hợp lệ.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="code">
                        Mã xác nhận <span class="app-required" aria-hidden="true">*</span>
                    </label>
                    <input class="form-control"
                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                           type="text" id="code" name="code"
                           inputmode="numeric" autocomplete="one-time-code"
                           minlength="6" maxlength="6" pattern="[0-9]{6}" required
                           aria-describedby="code-help code-error">
                    <div id="code-help" class="form-text">
                        Mã chỉ có hiệu lực trong thời gian giới hạn.
                    </div>
                    <div id="code-error" class="invalid-feedback"
                         th:if="${#fields.hasErrors('code')}"
                         th:errors="*{code}" role="alert">Mã xác nhận không hợp lệ.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="newPassword">
                        Mật khẩu mới <span class="app-required" aria-hidden="true">*</span>
                    </label>
                    <input class="form-control"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                           type="password" id="newPassword" name="newPassword"
                           autocomplete="new-password" minlength="8" maxlength="64" required
                           aria-describedby="new-password-help new-password-error">
                    <div id="new-password-help" class="form-text">Dùng từ 8 đến 64 ký tự.</div>
                    <div id="new-password-error" class="invalid-feedback"
                         th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}" role="alert">Mật khẩu không hợp lệ.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="confirmPassword">
                        Xác nhận mật khẩu mới <span class="app-required" aria-hidden="true">*</span>
                    </label>
                    <input class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           type="password" id="confirmPassword" name="confirmPassword"
                           autocomplete="new-password" maxlength="64" required
                           aria-describedby="confirm-password-error">
                    <div id="confirm-password-error" class="invalid-feedback"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}" role="alert">
                        Mật khẩu xác nhận không khớp.
                    </div>
                </div>

                <button class="btn btn-app-primary btn-lg w-100" type="submit">
                    Đặt lại mật khẩu
                </button>
            </form>

            <p class="app-auth-switch">
                Chưa có mã? <a th:href="@{/forgot-password}" href="/forgot-password">Gửi mã mới</a>
            </p>
        </div>
    </section>
</main>
</body>
</html>
