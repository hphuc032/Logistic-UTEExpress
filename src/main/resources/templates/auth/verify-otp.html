<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head>
    <title>Xác minh email | UTEExpress</title>
</head>
<body>
<main>
    <section class="app-auth-section" aria-labelledby="verify-title">
        <div class="app-auth-card">
            <div class="app-auth-heading">
                <span class="app-eyebrow">Bảo vệ tài khoản</span>
                <h1 id="verify-title">Xác minh email</h1>
                <p>Nhập mã gồm 6 chữ số đã được gửi đến email đăng ký của bạn.</p>
            </div>

            <form method="post" th:action="@{/verify-otp}" th:object="${verifyOtpForm}" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="identifier">
                        Email hoặc tên đăng nhập <span class="app-required" aria-hidden="true">*</span>
                    </label>
                    <input class="form-control"
                           th:classappend="${#fields.hasErrors('identifier')} ? 'is-invalid'"
                           type="text" id="identifier" th:field="*{identifier}"
                           autocomplete="username" maxlength="254" required
                           aria-describedby="identifier-error">
                    <div id="identifier-error" class="invalid-feedback"
                         th:if="${#fields.hasErrors('identifier')}"
                         th:errors="*{identifier}" role="alert">Thông tin tài khoản không hợp lệ.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="code">
                        Mã xác minh <span class="app-required" aria-hidden="true">*</span>
                    </label>
                    <input class="form-control"
                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                           type="text" id="code" name="code"
                           inputmode="numeric" autocomplete="one-time-code"
                           minlength="6" maxlength="6" pattern="[0-9]{6}" required
                           aria-describedby="code-help code-error">
                    <div id="code-help" class="form-text">Mã có hiệu lực trong 10 phút.</div>
                    <div id="code-error" class="invalid-feedback"
                         th:if="${#fields.hasErrors('code')}"
                         th:errors="*{code}" role="alert">Mã xác minh không hợp lệ.</div>
                </div>

                <button class="btn btn-app-primary btn-lg w-100" type="submit">Xác minh email</button>
            </form>

            <hr class="my-4">

            <form method="post" th:action="@{/verify-otp/resend}" th:object="${resendOtpForm}" novalidate>
                <label class="form-label" for="resend-identifier">Gửi lại mã xác minh</label>
                <input class="form-control mb-2"
                       th:classappend="${#fields.hasErrors('identifier')} ? 'is-invalid'"
                       type="text" id="resend-identifier" th:field="*{identifier}"
                       autocomplete="username" maxlength="254" required
                       aria-describedby="resend-error">
                <div id="resend-error" class="invalid-feedback mb-2"
                     th:if="${#fields.hasErrors('identifier')}"
                     th:errors="*{identifier}" role="alert">Thông tin tài khoản không hợp lệ.</div>
                <button class="btn btn-app-ghost w-100" type="submit">Gửi lại mã</button>
            </form>

            <p class="app-auth-switch">Đã xác minh? <a th:href="@{/login}" href="/login">Đăng nhập</a></p>
        </div>
    </section>
</main>
</body>
</html>
