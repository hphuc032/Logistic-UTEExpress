<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head><title>Chi tiết chuyến giao | UTEExpress</title></head>
<body><section th:fragment="content" aria-label="Chi tiết chuyến giao">
<h1>Chi tiết chuyến giao</h1>
<dl><dt>Chuyến giao</dt><dd th:text="${shipment.id}"></dd>
<dt>Đơn hàng</dt><dd th:text="${shipment.orderId}"></dd>
<dt>Đơn vị vận chuyển</dt><dd th:text="${shipment.providerId}"></dd>
<dt>Dịch vụ</dt><dd th:text="${shipment.serviceCode}"></dd>
<dt>Phí vận chuyển</dt><dd th:text="${#numbers.formatDecimal(shipment.fee, 1, 'COMMA', 0, 'POINT') + ' VND'}"></dd>
<dt>Trạng thái</dt><dd th:text="${shipment.status}"></dd></dl>
<a th:href="@{/shipper/shipments/view}">Quay lại danh sách</a>
</section></body></html>
