<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head><title>Chi tiết chuyến giao | UTEExpress</title></head>
<body><section th:fragment="content" aria-label="Chi tiết chuyến giao">
<h1>Chi tiết chuyến giao</h1>
<dl><dt>Chuyến giao</dt><dd th:text="${shipment.id}"></dd>
<dt>Đơn hàng</dt><dd th:text="${shipment.orderId}"></dd>
<dt>Đơn vị vận chuyển</dt><dd th:text="${shipment.providerId}"></dd>
<dt>Dịch vụ</dt><dd th:text="${shipment.serviceCode}"></dd>
<dt>Phí vận chuyển</dt><dd th:text="${#numbers.formatDecimal(shipment.fee, 1, 'COMMA', 0, 'POINT') + ' VND'}"></dd>
<dt>Trạng thái</dt><dd th:text="${shipment.status}"></dd></dl>
<form method="post" th:if="${shipment.status.name() == 'ASSIGNED'}" th:action="@{/shipper/orders/{id}/pickup(id=${shipment.orderId})}">
<input type="hidden" name="expectedOrderVersion" th:value="${orderVersion}"><input type="hidden" name="expectedShipmentVersion" th:value="${shipment.version}">
<button type="submit" class="btn btn-primary">Đã nhận hàng</button>
</form>
<form method="post" th:if="${shipment.status.name() == 'PICKED_UP'}" th:action="@{/shipper/orders/{id}/shipping(id=${shipment.orderId})}">
<input type="hidden" name="expectedOrderVersion" th:value="${orderVersion}"><input type="hidden" name="expectedShipmentVersion" th:value="${shipment.version}">
<button type="submit" class="btn btn-primary">Bắt đầu giao hàng</button>
</form>
<form method="post" th:if="${shipment.status.name() == 'SHIPPING'}" th:action="@{/shipper/orders/{id}/delivered(id=${shipment.orderId})}">
<input type="hidden" name="expectedOrderVersion" th:value="${orderVersion}"><input type="hidden" name="expectedShipmentVersion" th:value="${shipment.version}">
<label for="collectedAmount">Số tiền COD đã thu (VND)</label><input id="collectedAmount" name="collectedAmount" type="number" min="0" step="0.01" required>
<button type="submit" class="btn btn-primary">Xác nhận giao thành công</button>
</form>
<a th:href="@{/shipper/shipments/view}">Quay lại danh sách</a>
</section></body></html>
