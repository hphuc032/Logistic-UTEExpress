<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head><title>Thông tin đơn vị vận chuyển | UTEExpress</title></head>
<body><section th:fragment="content">
<nav aria-label="Cấu hình vận chuyển" class="d-flex flex-wrap gap-3 mb-4">
<a th:href="@{${#strings.replace(basePath,'/shipping','/dashboard')}}">← Tổng quan</a>
<a th:href="@{${basePath + '/providers'}}">Đơn vị vận chuyển</a>
<a th:href="@{${basePath + '/rates'}}">Bảng phí</a>
</nav>

<h1 class="h2 mb-4" th:text="${itemId == null ? 'Thêm đơn vị vận chuyển' : 'Sửa đơn vị vận chuyển'}"></h1>
<form method="post" class="card p-4" th:object="${shippingProviderRequest}"
th:action="@{${basePath + '/providers' + (itemId == null ? '' : '/' + itemId + '/update')}}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}" role="alert">Vui lòng kiểm tra mã, tên và trạng thái hợp lệ.</div>
<input th:if="${itemId != null}" type="hidden" th:field="*{version}">
<div class="mb-3"><label for="code" class="form-label">Mã đơn vị</label>
<input class="form-control" th:field="*{code}" id="code" maxlength="32" pattern="[A-Z][A-Z0-9_]{0,31}" required th:readonly="${itemId != null}" aria-describedby="codeHelp">
<div id="codeHelp" class="form-text">Chữ in hoa, số, dấu gạch dưới. Mã không đổi sau khi tạo.</div></div>
<div class="mb-3"><label for="name" class="form-label">Tên đơn vị</label><input class="form-control" th:field="*{name}" id="name" maxlength="120" required></div>
<div class="form-check mb-4"><input class="form-check-input" type="checkbox" th:field="*{active}" id="active"><label class="form-check-label" for="active">Bật đơn vị vận chuyển</label></div>
<div class="d-flex flex-wrap gap-2"><button class="btn btn-primary">Lưu đơn vị</button><a class="btn btn-outline-secondary" th:href="@{${basePath + '/providers'}}">Hủy</a>
<a th:if="${itemId != null}" class="btn btn-link" th:href="@{${basePath + '/providers/' + itemId + '/edit'}}">Tải lại dữ liệu mới nhất</a></div></form>
</section></body></html>
