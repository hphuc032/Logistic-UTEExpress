<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<a class="app-skip-link" href="#main-content">Chuyển đến nội dung chính</a>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main id="main-content" class="app-main" tabindex="-1">
    <div class="container app-container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <th:block th:replace="${content}"></th:block>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
