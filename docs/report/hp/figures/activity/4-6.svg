<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="410" viewBox="0 0 1600 410"><rect width="100%" height="100%" fill="white"/><text x="35" y="45" font-family="Arial" font-size="29">Yêu cầu khôi phục mật khẩu</text><rect x="30" y="90" width="475" height="105" rx="12" fill="#eef3f8" stroke="#66788a"/><text x="48" y="129" font-family="Arial" font-size="23">Email hợp lệ và CSRF</text><path d="M508 142h39l-12 -8m12 8l-12 8" fill="none" stroke="#233e58" stroke-width="3"/><rect x="555" y="90" width="475" height="105" rx="12" fill="#eef3f8" stroke="#66788a"/><text x="573" y="129" font-family="Arial" font-size="23">Transaction tìm ACTIVE user</text><path d="M1033 142h39l-12 -8m12 8l-12 8" fill="none" stroke="#233e58" stroke-width="3"/><rect x="1080" y="90" width="475" height="105" rx="12" fill="#eef3f8" stroke="#66788a"/><text x="1098" y="129" font-family="Arial" font-size="23">Cooldown theo RESET_PASSWORD</text><text x="1290" y="225" font-family="Arial" font-size="18">↓ tiếp tục hàng sau</text><rect x="30" y="245" width="475" height="105" rx="12" fill="#eef3f8" stroke="#66788a"/><text x="48" y="284" font-family="Arial" font-size="23">Sinh HMAC và lưu OTP</text><path d="M508 297h39l-12 -8m12 8l-12 8" fill="none" stroke="#233e58" stroke-width="3"/><rect x="555" y="245" width="475" height="105" rx="12" fill="#eef3f8" stroke="#66788a"/><text x="573" y="284" font-family="Arial" font-size="23">Commit rồi gửi SMTP</text><path d="M1033 297h39l-12 -8m12 8l-12 8" fill="none" stroke="#233e58" stroke-width="3"/><rect x="1080" y="245" width="475" height="105" rx="12" fill="#eef3f8" stroke="#66788a"/><text x="1098" y="284" font-family="Arial" font-size="23">Cùng redirect và thông báo</text><text x="1098" y="313" font-family="Arial" font-size="23">chung</text></svg>