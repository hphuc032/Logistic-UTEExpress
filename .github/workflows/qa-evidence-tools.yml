name: QA evidence tooling
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'scripts/qa/**'
      - '.github/workflows/qa-evidence-tools.yml'
permissions:
  contents: read
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Evidence failure-path and sanitization tests
        run: python -B -m unittest discover -s scripts/qa/tests -v
