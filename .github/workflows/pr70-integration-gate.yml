name: PR70 full integration gate

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  refund-integration:
    if: github.event.pull_request.number == 70
    name: PR70 Java PostgreSQL refund regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Full and targeted disposable PostgreSQL regression
        env:
          QA70_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
